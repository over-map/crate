# Runs in the PRIVATE data repo (over-map/crate-data). The code comes from the public repo.
name: nightly
# 01:30 UTC = 03:30 Amsterdam in summer, 02:30 in winter (GitHub cron is UTC only).
on:
  schedule: [{ cron: "30 1 * * *" }]
  workflow_dispatch:
    inputs:
      max:
        description: Max tracks to analyse
        default: "400"
concurrency: { group: crate-data, cancel-in-progress: false }
permissions: { contents: write }
env:
  CRATE_CODE_REPO: ${{ vars.CRATE_CODE_REPO || 'over-map/crate' }}
  SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
  SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
  SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
  GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  CRATE_MODELS_MIRROR: ${{ vars.CRATE_MODELS_MIRROR }}
  DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out the code (public repo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: "${{ vars.CRATE_CODE_REPO || 'over-map/crate' }}" }
      - name: Check out the data (this private repo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: private }
      - name: Link the data into the code checkout
        run: ln -s private/data data && ln -s private/backup backup
      - uses: ./.github/actions/setup
        with: { audio: "true" }
      - name: Sync Liked Songs
        working-directory: pipeline
        run: uv run crate sync
      - name: Analyse
        working-directory: pipeline
        run: uv run crate analyse --max ${{ inputs.max || '400' }}
      - name: Community tags
        working-directory: pipeline
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: uv run crate tags --max 300
      - name: Discogs second opinion
        if: env.DISCOGS_TOKEN != ''
        working-directory: pipeline
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: uv run crate discogs --max 300
      - name: Merge tags and consensus
        working-directory: pipeline
        run: |
          uv run crate tags --offline
          uv run crate consensus
      - name: Export vectors
        working-directory: pipeline
        run: |
          if [ -f ../data/pca.npz ]; then uv run crate vectors; else echo "no PCA basis yet (run crate vectors --fit after backfill)"; fi
      - uses: ./.github/actions/commit
        with: { directory: private, message: "nightly: sync and analyse" }
      - name: Minutes used
        if: always()
        run: |
          echo "Minutes used: $(( ($(date +%s) - START + 59) / 60 ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Alert on failure
        if: failure()
        run: |
          curl -s -H "Title: Crate problem" -H "Priority: high" -d "Nightly sync failed → docs/runbook.md#nightly-failed" "https://ntfy.sh/$NTFY_TOPIC"
