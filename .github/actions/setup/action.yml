name: Set up Crate pipeline
description: uv, Python 3.11, dependencies and the model/HTTP/embedding caches
inputs:
  audio:
    description: Install Essentia (needed for analyse and weekly)
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      with:
        python-version: "3.11"
        enable-cache: true
        cache-dependency-glob: pipeline/uv.lock
    - name: Install
      shell: bash
      working-directory: pipeline
      run: |
        if [ "${{ inputs.audio }}" = "true" ]; then uv sync --frozen --extra audio; else uv sync --frozen; fi
    - name: Restore model files
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: .cache/models
        key: crate-models-${{ hashFiles('pipeline/models.lock.json') }}
    - name: Restore HTTP and embedding caches
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          .cache/http
          .cache/embeddings
        key: crate-cache-${{ github.run_id }}
        restore-keys: crate-cache-
