name: tests
on:
  push: { branches: [main], paths-ignore: [data/**, docs/tag-quality-report.md, heartbeat] }
  pull_request:
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with: { python-version: "3.11" }
      - working-directory: pipeline
        run: |
          uv sync --frozen
          uv run ruff check crate tests
          uv run pytest -q
  swift:
    # Runs the same spec/query_vectors.json and spec/camelot_vectors.json: CI fails if Swift and Python diverge.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - working-directory: ios/CrateKit
        run: swift test
  android:
    # The Kotlin core runs the same spec vectors too, and the app must build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - working-directory: android
        run: ./gradlew --no-configuration-cache :core:test :app:testDebugUnitTest :app:assembleDebug
