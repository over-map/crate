name: tests
on:
  push: { branches: [main], paths-ignore: [data/**, docs/tag-quality-report.md, heartbeat] }
  pull_request:
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.11" }
      - working-directory: pipeline
        run: |
          uv sync --frozen
          uv run ruff check crate tests
          uv run pytest -q
  swift:
    # Runs the same spec/query_vectors.json and spec/camelot_vectors.json: CI fails if Swift and Python diverge.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: ios/CrateKit
        run: swift test
  android:
    # The Kotlin core runs the same spec vectors too, and the app must build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - working-directory: android
        run: ./gradlew --no-configuration-cache :core:test :app:testDebugUnitTest :app:assembleDebug
