name: tests
on:
  push: { branches: [main], paths-ignore: [data/**, docs/tag-quality-report.md, heartbeat] }
  pull_request:
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { python-version: "3.11" }
      - working-directory: pipeline
        run: |
          uv sync --frozen
          uv run ruff check crate tests
          uv run pytest -q
  swift:
    # Runs the same spec/query_vectors.json and spec/camelot_vectors.json: CI fails if Swift and Python diverge.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: ios/CrateKit
        run: swift test
  android:
    # The Kotlin core runs the same spec vectors too, and the app must build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - working-directory: android
        run: ./gradlew --no-configuration-cache :core:test :app:testDebugUnitTest :app:assembleDebug
