name: android-release
# Push a tag like android-v1.0 to build a signed APK and attach it to a GitHub Release (not Google Play).
# Secrets: CRATE_KEYSTORE_B64 (base64 of android/crate-release.jks), CRATE_KEYSTORE_PASSWORD. See docs/handoff/android.md.
on:
  push: { tags: ["android-v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build signed APK
        working-directory: android
        env:
          CRATE_KEYSTORE_B64: ${{ secrets.CRATE_KEYSTORE_B64 }}
          CRATE_KEYSTORE_PASSWORD: ${{ secrets.CRATE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$CRATE_KEYSTORE_B64" || { echo "::error::CRATE_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$CRATE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/crate.jks"
          export CRATE_KEYSTORE_FILE="$RUNNER_TEMP/crate.jks"
          export CRATE_VERSION_CODE="${{ github.run_number }}"
          export CRATE_VERSION_NAME="${GITHUB_REF_NAME#android-v}"
          ./gradlew --no-configuration-cache :core:test :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Crate-$CRATE_VERSION_NAME.apk"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/Crate-*.apk --title "Crate for Android ${GITHUB_REF_NAME#android-v}" --notes "Install the APK on your phone (allow installs from this source once). Updates install over the previous version."
